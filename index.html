<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISF Admin — Modération</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090d;
      --surface: #0f1117;
      --surface2: #161922;
      --border: #1e2230;
      --text: #e2e5ed;
      --text2: #7a8099;
      --accent: #6366f1;
      --accent-dim: rgba(99,102,241,0.12);
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.12);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.12);
      --amber: #f59e0b;
      --amber-dim: rgba(245,158,11,0.12);
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .topbar-logo {
      font-size: 22px;
      filter: drop-shadow(0 0 8px rgba(99,102,241,0.3));
    }
    .topbar h1 {
      font-size: 16px;
      font-weight: 700;
    }
    .topbar h1 span {
      color: var(--accent);
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .config-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .config-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== CONFIG MODAL ===== */
    .config-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .config-overlay.open { display: flex; }
    .config-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 440px;
      max-width: 90vw;
    }
    .config-box h2 {
      font-size: 18px;
      margin-bottom: 18px;
    }
    .config-box label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px;
      margin-top: 14px;
    }
    .config-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
    }
    .config-box input:focus { border-color: var(--accent); }
    .config-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    /* ===== STATS ===== */
    .stats-row {
      display: flex;
      gap: 16px;
      padding: 24px 32px;
    }
    .stat-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .stat-card .val {
      font-size: 32px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-card .label {
      font-size: 11px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 4px;
    }
    .stat-card.pending .val { color: var(--amber); }
    .stat-card.approved .val { color: var(--green); }
    .stat-card.rejected .val { color: var(--red); }
    .stat-card.total .val { color: var(--accent); }

    /* ===== TABS ===== */
    .tabs {
      padding: 0 32px;
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: inherit;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab .badge {
      background: var(--amber-dim);
      color: var(--amber);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      margin-left: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ===== TABLE ===== */
    .table-wrap {
      padding: 20px 32px 40px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text2);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:hover { background: var(--surface); }
    tbody td {
      padding: 14px;
      font-size: 13px;
      vertical-align: middle;
    }
    .term-cell {
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }
    .company-cell {
      color: var(--text2);
      font-size: 12px;
    }
    .count-cell {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--amber);
    }
    .date-cell {
      color: var(--text2);
      font-size: 12px;
    }

    /* Buttons */
    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-approve {
      background: var(--green-dim);
      color: var(--green);
    }
    .btn-approve:hover { background: var(--green); color: #fff; }
    .btn-reject {
      background: var(--red-dim);
      color: var(--red);
    }
    .btn-reject:hover { background: var(--red); color: #fff; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-ghost {
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--text2); color: var(--text); }

    .actions-cell {
      display: flex;
      gap: 6px;
    }

    /* Status badges */
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .status-badge.approved { background: var(--green-dim); color: var(--green); }
    .status-badge.rejected { background: var(--red-dim); color: var(--red); }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text2);
    }
    .empty .icon { font-size: 40px; margin-bottom: 12px; }
    .empty p { font-size: 14px; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text2);
      font-size: 14px;
    }

    /* Approved terms list */
    .terms-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 20px 32px;
    }
    .term-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 10px 5px 14px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }
    .term-tag .del {
      cursor: pointer;
      color: var(--red);
      font-size: 14px;
      font-weight: bold;
      padding: 0 4px;
      border-radius: 50%;
      transition: background 0.15s;
      background: none;
      border: none;
      font-family: inherit;
    }
    .term-tag .del:hover { background: var(--red-dim); }

    /* Add term manually */
    .add-row {
      display: flex;
      gap: 8px;
      padding: 0 32px 20px;
    }
    .add-row input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
    }
    .add-row input:focus { border-color: var(--accent); }
    .add-row input::placeholder { color: var(--text2); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    tbody tr { animation: fadeIn 0.2s ease both; }
  </style>
</head>
<body>

  <!-- Config overlay -->
  <div class="config-overlay" id="configOverlay">
    <div class="config-box">
      <h2>⚙️ Configuration Supabase</h2>
      <label>URL du projet</label>
      <input type="text" id="cfgUrl" placeholder="https://xxxxx.supabase.co">
      <label>Service Role Key (admin, secret)</label>
      <input type="password" id="cfgKey" placeholder="eyJhbGciOiJIUzI1NiIs...">
      <p style="font-size:11px;color:var(--text2);margin-top:12px;">
        ⚠️ La service_role key a un accès total. Ne la partage jamais. Elle est stockée uniquement en localStorage sur ta machine.
      </p>
      <div class="config-actions">
        <button class="btn btn-ghost" onclick="closeConfig()">Annuler</button>
        <button class="btn btn-primary" onclick="saveConfig()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">🛡️</div>
      <h1>Indeed Scam Filter — <span>Admin</span></h1>
    </div>
    <div class="topbar-right">
      <button class="config-btn" onclick="openConfig()">⚙️ Config</button>
      <button class="config-btn" onclick="loadAll()">🔄 Refresh</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card pending"><div class="val" id="sPending">–</div><div class="label">En attente</div></div>
    <div class="stat-card approved"><div class="val" id="sApproved">–</div><div class="label">Approuvés</div></div>
    <div class="stat-card rejected"><div class="val" id="sRejected">–</div><div class="label">Rejetés</div></div>
    <div class="stat-card total"><div class="val" id="sTotal">–</div><div class="label">Termes actifs</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="pending">
      🕐 En attente <span class="badge" id="pendingBadge">0</span>
    </button>
    <button class="tab" data-tab="history">📋 Historique</button>
    <button class="tab" data-tab="terms">🏷️ Termes actifs</button>
  </div>

  <!-- Content -->
  <div id="content"></div>

  <script>
    // ===== CONFIG =====
    let SUPABASE_URL = localStorage.getItem("isf_url") || "";
    let SERVICE_KEY = localStorage.getItem("isf_key") || "";

    function openConfig() {
      document.getElementById("cfgUrl").value = SUPABASE_URL;
      document.getElementById("cfgKey").value = SERVICE_KEY;
      document.getElementById("configOverlay").classList.add("open");
    }
    function closeConfig() {
      document.getElementById("configOverlay").classList.remove("open");
    }
    function saveConfig() {
      SUPABASE_URL = document.getElementById("cfgUrl").value.trim().replace(/\/$/, "");
      SERVICE_KEY = document.getElementById("cfgKey").value.trim();
      localStorage.setItem("isf_url", SUPABASE_URL);
      localStorage.setItem("isf_key", SERVICE_KEY);
      closeConfig();
      loadAll();
    }

    function headers() {
      return {
        apikey: SERVICE_KEY,
        Authorization: `Bearer ${SERVICE_KEY}`,
        "Content-Type": "application/json",
      };
    }

    async function api(path, opts = {}) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        headers: { ...headers(), ...(opts.extraHeaders || {}) },
        method: opts.method || "GET",
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      if (opts.method === "DELETE" || opts.method === "PATCH") return null;
      return res.json();
    }

    async function rpc(fn, params) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify(params),
      });
      if (!res.ok) throw new Error(`${res.status}`);
    }

    // ===== STATE =====
    let currentTab = "pending";
    let reports = [];
    let approvedTerms = [];

    // ===== LOAD DATA =====
    async function loadAll() {
      if (!SUPABASE_URL || !SERVICE_KEY) {
        openConfig();
        return;
      }
      try {
        const [statsArr, reps, terms] = await Promise.all([
          api("admin_stats"),
          api("reports?order=created_at.desc&limit=200"),
          api("approved_terms?order=term.asc"),
        ]);

        const stats = statsArr[0] || {};
        document.getElementById("sPending").textContent = stats.pending_count || 0;
        document.getElementById("sApproved").textContent = stats.approved_count || 0;
        document.getElementById("sRejected").textContent = stats.rejected_count || 0;
        document.getElementById("sTotal").textContent = stats.total_terms || 0;
        document.getElementById("pendingBadge").textContent = stats.pending_count || 0;

        reports = reps || [];
        approvedTerms = terms || [];

        renderTab();
      } catch (err) {
        document.getElementById("content").innerHTML = `
          <div class="empty">
            <div class="icon">❌</div>
            <p>Erreur : ${err.message}</p>
            <p style="font-size:12px;margin-top:8px;color:var(--text2)">Vérifie ta config Supabase</p>
          </div>`;
      }
    }

    // ===== RENDER =====
    function renderTab() {
      const c = document.getElementById("content");

      if (currentTab === "pending") {
        const pending = reports.filter((r) => r.status === "pending");

        // Group by term
        const grouped = {};
        pending.forEach((r) => {
          const key = r.term.toLowerCase().trim();
          if (!grouped[key]) {
            grouped[key] = { term: key, company: r.company_name, reports: [], ids: [] };
          }
          grouped[key].reports.push(r);
          grouped[key].ids.push(r.id);
        });
        const groups = Object.values(grouped).sort((a, b) => b.reports.length - a.reports.length);

        if (groups.length === 0) {
          c.innerHTML = `<div class="empty"><div class="icon">✅</div><p>Aucun signalement en attente</p></div>`;
          return;
        }

        c.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Terme</th>
                  <th>Entreprise</th>
                  <th>Signalements</th>
                  <th>Premier signalement</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${groups.map((g, i) => `
                  <tr style="animation-delay:${i * 30}ms">
                    <td class="term-cell">${esc(g.term)}</td>
                    <td class="company-cell">${esc(g.company || "—")}</td>
                    <td class="count-cell">${g.reports.length}×</td>
                    <td class="date-cell">${fmtDate(g.reports[g.reports.length - 1].created_at)}</td>
                    <td>
                      <div class="actions-cell">
                        <button class="btn btn-approve" onclick="approveGroup('${g.ids[0]}')">✓ Approuver</button>
                        <button class="btn btn-reject" onclick="rejectGroup('${g.ids.join(",")}')">✗ Rejeter</button>
                      </div>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>`;

      } else if (currentTab === "history") {
        const reviewed = reports.filter((r) => r.status !== "pending");

        if (reviewed.length === 0) {
          c.innerHTML = `<div class="empty"><div class="icon">📋</div><p>Aucun historique</p></div>`;
          return;
        }

        c.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Terme</th><th>Entreprise</th><th>Status</th><th>Date</th></tr>
              </thead>
              <tbody>
                ${reviewed.slice(0, 100).map((r, i) => `
                  <tr style="animation-delay:${i * 20}ms">
                    <td class="term-cell">${esc(r.term)}</td>
                    <td class="company-cell">${esc(r.company_name || "—")}</td>
                    <td><span class="status-badge ${r.status}">${r.status === "approved" ? "✓ Approuvé" : "✗ Rejeté"}</span></td>
                    <td class="date-cell">${fmtDate(r.reviewed_at || r.created_at)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>`;

      } else if (currentTab === "terms") {
        c.innerHTML = `
          <div class="add-row" style="padding-top:20px;">
            <input type="text" id="manualTerm" placeholder="Ajouter un terme manuellement...">
            <button class="btn btn-primary" onclick="addManualTerm()">+ Ajouter</button>
          </div>
          <div class="terms-grid">
            ${approvedTerms.length === 0
              ? '<div class="empty" style="width:100%"><div class="icon">🏷️</div><p>Aucun terme communautaire</p></div>'
              : approvedTerms.map((t) => `
                <span class="term-tag">
                  ${esc(t.term)}
                  <button class="del" onclick="deleteTerm('${t.id}', '${esc(t.term)}')">×</button>
                </span>
              `).join("")}
          </div>`;
      }
    }

    // ===== ACTIONS =====
    async function approveGroup(reportId) {
      try {
        await rpc("approve_report", { report_id: reportId });
        loadAll();
      } catch (err) {
        alert("Erreur: " + err.message);
      }
    }

    async function rejectGroup(idsCsv) {
      try {
        const ids = idsCsv.split(",");
        for (const id of ids) {
          await rpc("reject_report", { report_id: id });
        }
        loadAll();
      } catch (err) {
        alert("Erreur: " + err.message);
      }
    }

    async function deleteTerm(id, term) {
      if (!confirm(`Supprimer "${term}" de la liste communautaire ?`)) return;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/approved_terms?id=eq.${id}`, {
          method: "DELETE",
          headers: headers(),
        });
        loadAll();
      } catch (err) {
        alert("Erreur: " + err.message);
      }
    }

    async function addManualTerm() {
      const input = document.getElementById("manualTerm");
      const term = input.value.trim().toLowerCase();
      if (!term) return;
      try {
        await api("approved_terms", {
          method: "POST",
          body: { term, category: "manual" },
          extraHeaders: { Prefer: "return=minimal" },
        });
        input.value = "";
        loadAll();
      } catch (err) {
        alert("Erreur (doublon ?) : " + err.message);
      }
    }

    // ===== TABS =====
    document.querySelectorAll(".tab").forEach((t) => {
      t.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
        t.classList.add("active");
        currentTab = t.dataset.tab;
        renderTab();
      });
    });

    // ===== UTILS =====
    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }
    function fmtDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    // ===== INIT =====
    loadAll();
  </script>
</body>
</html>
